[package]
name = "mellow-desktop"
version = "1.4.6"
description = "Mellow V0.0 Runtime Qualification Shell"
edition = "2021"

[lib]
name = "mellow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Runtime Qualification 直接调用 Cargo，而不是 Tauri CLI；显式转发此 feature
# 才会把 `frontendDist` 嵌入 release 二进制，而非在运行时请求 devUrl。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
notify = "8"
# 系统打开/定位（PRD §54 Open Image / Reveal；三平台）
tauri-plugin-opener = "2"
# 跨平台回收站（macOS Finder / Windows Recycle Bin / Linux trash spec；PRD §57）
trash = "5"
# 远程图片下载（spec image-workflow §9：仅用户显式命令；rustls TLS）
ureq = "2"
# 剪贴板图片写入（Typora「拷贝图片」D3；三平台）+ 图片解码
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[dev-dependencies]
# 更新签名校验测试（与 tauri-plugin-updater 同款 minisign 语义）
minisign-verify = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Windows JumpList（PRD §134 P1 Recent integration）：SHAddToRecentDocs 系统最近文档
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
