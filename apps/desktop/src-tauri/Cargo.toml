[package]
name = "mellow-desktop"
version = "0.0.0"
description = "Mellow V0.0 Runtime Qualification Shell"
edition = "2021"

[lib]
name = "mellow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# 跨平台回收站（macOS Finder / Windows Recycle Bin / Linux trash spec；PRD §57）
trash = "5"
# 远程图片下载（spec image-workflow §9：仅用户显式命令；rustls TLS）
ureq = "2"
# 系统打开/定位（PRD §54 Open Image / Reveal）
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
