# Runtime Qualification —— 用 GitHub Actions runner 作为真机测试机（用户无本地 Windows/Linux 环境）。
#
# - Linux：Xvfb 虚拟显示 + fcitx5 拼音 + xdotool/xclip → 执行 ime-matrix-linux.mjs（8 场景 IME 矩阵，
#   断言无丢字/重复 + undo 完整性）；
# - Windows：启动 release 二进制 + SendKeys 输入 + 保存读回（最佳努力）；
# - macOS：启动 + CLI 打开 + 进程存活（无 GUI 自动化权限时的最小运行时证据）。
#
# 构建阶段拆分为独立步骤（显式 working-directory，避免跨 shell 的 cd 残留）。

name: Runtime Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-runtime:
    name: "Linux: Xvfb + fcitx5 IME matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: mellow
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mellow/pnpm-lock.yaml
      - name: Install system deps (GUI + X + IME)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xdotool xclip dbus-x11 fcitx5 fcitx5-chinese-addons fcitx5-frontend-gtk3 fonts-noto-cjk openbox imagemagick pandoc ydotool ydotoold
      - name: Install workspace
        working-directory: mellow
        run: pnpm install --frozen-lockfile
      - name: Build vendored CoreEditor (yarn)
        working-directory: mellow/packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build wrapper + engine + desktop frontend
        working-directory: mellow
        run: |
          pnpm --filter @mellow/editor-core run build
          pnpm --filter @mellow/editor-engine run build
          pnpm --filter mellow-desktop run build
      - name: Build Rust release binary
        working-directory: mellow/apps/desktop/src-tauri
        run: cargo build --release
      - name: Link /mellow for harness
        run: |
          sudo ln -sfn "$GITHUB_WORKSPACE/mellow" /mellow
      - name: "Linux runtime matrix (Xvfb + fcitx5)"
        working-directory: mellow
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          sudo modprobe uinput || true
          # Ubuntu 24.04 的发行版 ydotool 0.1.8 忽略 socket 参数，固定使用默认路径。
          sudo ydotoold > /tmp/ydotool.log 2>&1 &
          sleep 2
          sudo chown "$(id -u):$(id -g)" /tmp/.ydotool_socket
          test -S /tmp/.ydotool_socket
          mkdir -p /tmp/runtime-root && chmod 700 /tmp/runtime-root
          mkdir -p ~/.config/fcitx5
          cat > ~/.config/fcitx5/profile <<'EOF'
          [Groups/0]
          Name=Default
          Default Layout=us
          DefaultIM=pinyin

          [Groups/0/Items/0]
          Name=keyboard-us
          Layout=

          [Groups/0/Items/1]
          Name=pinyin
          Layout=
          EOF
          dbus-run-session -- bash -c '
            # `ime-matrix-linux.mjs` 的非零退出码必须使整个 CI job 失败。
            # 没有 errexit 时，后续 10 MB 冒烟或 pkill 的成功会掩盖 IME 失败。
            set -euo pipefail
            export DISPLAY=:99 XDG_RUNTIME_DIR=/tmp/runtime-root
            export YDOTOOL_SOCKET=/tmp/.ydotool_socket
            export GTK_IM_MODULE=fcitx QT_IM_MODULE=fcitx XMODIFIERS=@im=fcitx
            export WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 GDK_BACKEND=x11
            export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe WEBKIT_FORCE_SANDBOX=0
            openbox > /tmp/openbox.log 2>&1 &
            sleep 2
            fcitx5 -d > /tmp/fcitx5.log 2>&1 &
            sleep 6
            # 确保 WebKitGTK 能加载 fcitx GTK 输入法模块，并显式切到拼音。
            # 旧 run 只证明 pinyin addon 已加载，未证明输入法前端和当前 IM 状态。
            # 直接验证 fcitx GTK3 输入法模块。Ubuntu 24 的 gtk-query-immodules
            # 二进制位于私有 libgtk 目录且不在 PATH，不能把其命令名当作 Gate。
            FCITX_GTK_IMMODULE=$(dpkg -L fcitx5-frontend-gtk3 | awk "/\\/im-fcitx5\\.so$/ { print; exit }")
            test -f "$FCITX_GTK_IMMODULE"
            echo "fcitx_gtk_immodule=$FCITX_GTK_IMMODULE"
            fcitx5-remote -o
            fcitx5-remote -s pinyin
            for _ in $(seq 1 10); do
              FCITX_CURRENT=$(busctl --user call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 CurrentInputMethod 2>/dev/null || true)
              echo "fcitx_current=$FCITX_CURRENT"
              case "$FCITX_CURRENT" in *pinyin*) break ;; esac
              sleep 1
            done
            case "$FCITX_CURRENT" in *pinyin*) ;; *) echo "fcitx5 did not select pinyin" >&2; exit 1 ;; esac
            fcitx5-diagnose > /tmp/fcitx5-diagnose.txt 2>&1 || true
            # 截图可视化诊断：启动 → 等待 → 捕获整屏 + 窗口几何
            echo "# Screenshot Test" > /tmp/mellow-shot.md
            echo "" >> /tmp/mellow-shot.md
            echo "Hello **Mellow** on Linux" >> /tmp/mellow-shot.md
            nohup ./apps/desktop/src-tauri/target/release/mellow-desktop /tmp/mellow-shot.md > /tmp/mellow-shot.log 2>&1 &
            sleep 15
            xdotool search --name Mellow 2>/dev/null > /tmp/mellow-windows.txt || true
            xwininfo -root -children -display :99 2>/dev/null > /tmp/xwininfo.txt || true
            for w in $(cat /tmp/mellow-windows.txt 2>/dev/null); do echo "== window $w ==" >> /tmp/mellow-geometry.txt; xdotool getwindowgeometry $w >> /tmp/mellow-geometry.txt 2>&1 || true; xdotool getwindowname $w >> /tmp/mellow-geometry.txt 2>&1 || true; done
            import -display :99 -window root /tmp/mellow-screen.png 2>/dev/null || xwd -root -display :99 -out /tmp/mellow-screen.xwd 2>/dev/null || true
            # ASCII 输入隔离诊断：聚焦后输入 TEST + Ctrl+S，读回文件（同一实例，pkill 之前）
            WID2=$(xdotool search --onlyvisible --name Mellow 2>/dev/null | head -1)
            echo "diagnostic_wid=$WID2"
            if [ -n "$WID2" ]; then
              xdotool windowactivate --sync $WID2 2>/dev/null; xdotool windowfocus --sync $WID2 2>/dev/null
              xdotool mousemove 600 250 click 1
              sleep 1
              xdotool type --delay 80 "TEST"
              sleep 1
              xdotool key --clearmodifiers ctrl+s
              sleep 2
              echo "focus=$(xdotool getwindowfocus 2>/dev/null) target=$WID2"
              echo "file_after_global=$(cat /tmp/mellow-shot.md)"
              # 直投窗口合成键（绕过焦点/XTEST 差异）
              xdotool key --window $WID2 --clearmodifiers 'a'
              sleep 1
              xdotool key --window $WID2 --clearmodifiers ctrl+s
              sleep 2
              echo "file_after_direct=$(cat /tmp/mellow-shot.md)"
              # 快捷键可达性诊断：Ctrl+Shift+P（命令面板）——若弹出则键盘事件可达 WebView
              xdotool key --clearmodifiers ctrl+shift+p
              sleep 2
              import -display :99 -window root /tmp/mellow-palette.png 2>/dev/null || true
              xdotool key --clearmodifiers Escape
              sleep 1
            fi
            pkill -x mellow-desktop || true
            sleep 2
            # IME 矩阵
            node tests/benchmark/ime-matrix-linux.mjs --im=fcitx5 --driver=ydotool
            # 10MB 大文件启动冒烟（PRD §110）：打开 10MB 文档 → 存活 → 渲染
            yes 中文测试行content0123456789 | head -c 10000000 > /tmp/mellow-10mb.md || true
            nohup ./apps/desktop/src-tauri/target/release/mellow-desktop /tmp/mellow-10mb.md > /tmp/mellow-10mb.log 2>&1 &
            sleep 15
            if kill -0 $! 2>/dev/null; then echo '10mb_alive=true'; else echo '10mb_alive=false'; tail -20 /tmp/mellow-10mb.log; exit 1; fi
            import -display :99 -window root /tmp/mellow-10mb.png 2>/dev/null || true
            pkill -x mellow-desktop || true
          '
      - name: Collect evidence
        working-directory: mellow
        run: |
          ls -la apps/desktop/src-tauri/target/release/mellow-desktop
          cat /tmp/mellow.log 2>/dev/null | tail -20 || true
          cat /tmp/fcitx5.log 2>/dev/null | tail -10 || true
          cat /tmp/openbox.log 2>/dev/null | tail -5 || true
          cat /tmp/ydotool.log 2>/dev/null | tail -20 || true

      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-evidence
          path: |
            /tmp/mellow-screen.*
            /tmp/mellow-after-type.png
            /tmp/mellow-palette.png
            /tmp/mellow-10mb.png
            /tmp/mellow-geometry.txt
            /tmp/xwininfo.txt
            /tmp/mellow-windows.txt
            /tmp/mellow-shot.log
            /tmp/mellow.log
            /tmp/fcitx5.log
            /tmp/fcitx5-diagnose.txt
            /tmp/ydotool.log
          if-no-files-found: warn

  windows-runtime:
    name: "Windows: launch + SendKeys smoke"
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build vendored CoreEditor (yarn)
        working-directory: packages/editor-core/CoreEditor
        shell: bash
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build wrapper + engine + desktop frontend
        run: |
          pnpm --filter @mellow/editor-core run build
          pnpm --filter @mellow/editor-engine run build
          pnpm --filter mellow-desktop run build
      - name: Build Rust release binary
        working-directory: apps/desktop/src-tauri
        run: cargo build --release
      - name: "Windows runtime smoke (launch + type + save)"
        shell: pwsh
        run: |
          $bin = Resolve-Path 'apps/desktop/src-tauri/target/release/mellow-desktop.exe'
          New-Item -ItemType Directory -Force -Path 'C:/tmp' | Out-Null
          $doc = 'C:/tmp/mellow-win-smoke.md'
          Set-Content -Path $doc -Value '# Mellow Windows Smoke'
          $p = Start-Process -FilePath $bin -ArgumentList $doc -PassThru
          Start-Sleep -Seconds 12
          $alive = -not $p.HasExited
          Write-Host ('app_alive=' + $alive)
          if (-not $alive) { throw 'Mellow exited before Windows runtime smoke input' }
          try {
            $ws = New-Object -ComObject WScript.Shell
            $ws.AppActivate('Mellow') | Out-Null
            Start-Sleep -Seconds 2
            $ws.SendKeys('Hello Mellow 123')
            Start-Sleep -Seconds 2
            $ws.SendKeys('^s')
            Start-Sleep -Seconds 3
          } catch { Write-Host ('sendkeys_failed=' + $_.Exception.Message) }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          $content = Get-Content -Path $doc -Raw -ErrorAction SilentlyContinue
          Write-Host ('file_after=' + $content)
          # 10MB 大文件启动冒烟
          $big = 'C:/tmp/mellow-10mb.md'
          $line = 'line content 0123456789'
          $sb = New-Object System.Text.StringBuilder
          1..800000 | ForEach-Object { [void]$sb.AppendLine($line) } | Out-Null
          [IO.File]::WriteAllText($big, $sb.ToString())
          $p2 = Start-Process -FilePath $bin -ArgumentList $big -PassThru
          Start-Sleep -Seconds 15
          $bigAlive = -not $p2.HasExited
          Write-Host ('10mb_alive=' + $bigAlive)
          if (-not $bigAlive) { throw 'Mellow exited while opening 10MB document on Windows' }
          if (-not $p2.HasExited) { Stop-Process -Id $p2.Id -Force }
          Write-Host 'Windows runtime smoke executed on windows-latest'

  macos-runtime:
    name: "macOS: launch + CLI open smoke"
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build vendored CoreEditor (yarn)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build wrapper + engine + desktop frontend
        run: |
          pnpm --filter @mellow/editor-core run build
          pnpm --filter @mellow/editor-engine run build
          pnpm --filter mellow-desktop run build
      - name: Build Rust release binary
        working-directory: apps/desktop/src-tauri
        run: cargo build --release
      - name: "macOS runtime smoke (launch + CLI open + alive)"
        run: |
          BIN=apps/desktop/src-tauri/target/release/mellow-desktop
          DOC=/tmp/mellow-mac-smoke.md
          printf '# Mellow macOS Smoke\n' > "$DOC"
          "$BIN" "$DOC" > /tmp/mellow-mac.log 2>&1 &
          APP_PID=$!
          sleep 12
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo 'app_alive=true'
          else
            echo 'app_alive=false'
            tail -30 /tmp/mellow-mac.log
            exit 1
          fi
          kill "$APP_PID" 2>/dev/null || true
          # 10MB 大文件启动冒烟
          yes 'line content 0123456789' | head -c 10000000 > /tmp/mellow-10mb.md || true
          "$BIN" /tmp/mellow-10mb.md > /tmp/mellow-10mb.log 2>&1 &
          BIG_PID=$!
          sleep 15
          if kill -0 "$BIG_PID" 2>/dev/null; then
            echo '10mb_alive=true'
          else
            echo '10mb_alive=false'
            tail -20 /tmp/mellow-10mb.log
            exit 1
          fi
          kill "$BIG_PID" 2>/dev/null || true
          echo 'macOS runtime smoke executed on macos-latest'
      - name: Collect evidence
        run: |
          cat /tmp/mellow-mac.log 2>/dev/null | tail -20 || true
          ls -la apps/desktop/src-tauri/target/release/mellow-desktop
