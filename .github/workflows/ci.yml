name: CI

on:
  push:
    branches: [main]
  pull_request:

# 统一 pnpm workspace 工具链（根 package.json + pnpm-workspace.yaml，阶段 0 迁移）。
# 特例：packages/editor-core/CoreEditor（vendored MarkEdit）排除出 workspace，保留上游 yarn。

jobs:
  editor-core:
    name: editor-core vendored (yarn) + wrapper (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Vendored CoreEditor (yarn, workspace 特例)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
          yarn test
      - name: "Mellow wrapper test + build (14: contract + neutral)"
        working-directory: packages/editor-core
        run: |
          pnpm test
          pnpm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: editor-core-dist
          path: packages/editor-core/CoreEditor/dist

  mellow-packages:
    name: Mellow packages typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm -r --filter '!mellow-desktop' run build
      # V7-W5：括号内数字为各包用例数（2026-09-12 实跑），仅作可读性参考；数量变化不会使 Job 失败。
      - name: "Unit tests (host-api 43 / document-model 26 / app-core 217 / i18n 15 / settings 13 / themes 12 / commands 30 / export 72)"
        run: pnpm -r --filter '!mellow-desktop' run test

  editor-engine:
    name: editor-engine test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "Test (1135: engine + IME Composition Guard / undo corruption)"
        working-directory: packages/editor-engine
        run: pnpm test
      - name: Build
        working-directory: packages/editor-engine
        run: pnpm run build

  desktop-frontend:
    name: Desktop frontend build
    runs-on: ubuntu-latest
    needs: [editor-core, editor-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore editor-core dist (vendored bundle)
        uses: actions/download-artifact@v4
        with:
          name: editor-core-dist
          path: packages/editor-core/CoreEditor/dist
      - name: Build editor-core wrapper (dist/bundle.js)
        working-directory: packages/editor-core
        run: pnpm run build
      - name: Build editor-engine (dist/)
        working-directory: packages/editor-engine
        run: pnpm run build
      - name: Desktop build (editor bundle + tsc + vite)
        working-directory: apps/desktop
        run: pnpm run build
      # V7-W5（G7-TYPO-04）：渲染层指纹锁此前从未在 CI 执行 —— 本地 bundle 与 CI 产物
      # 分叉无人发现（版本化文件名 + 时间戳 query，指纹漂移会静默加载旧引擎）。
      # 构建后必须跑 verify-release-bundle.mjs 断言 public/editor 产物与清单一致。
      - name: Verify editor release bundle fingerprint
        working-directory: apps/desktop
        run: node scripts/verify-release-bundle.mjs

  parity-guard:
    name: Typora parity guardrails (ledger + menu schema + guard self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 护栏脚本只依赖 Node 内建模块，无需 pnpm install，可在 30s 内给出结论。
      # 无 Typora 授权环境时 dump 生成器退化为 UNVERIFIED 占位（不构成验收证据）。
      - name: Generate Typora baseline dump
        run: node tests/benchmark/generate-typora-menu-dump.mjs
      - name: Parity ledger + menu contract + guard self-test + runtime qualification + UX gate
        run: npm run parity

  # V7-W5（2026-09-12）：补 Windows 契约门禁。
  # 背景：本 workflow 此前 6 个 job 全部 runs-on ubuntu-latest，**没有任何 Windows job**，
  # 与 ADR-0022「Windows 以 GitHub Actions 为正式 Runtime 证据来源」存在落差 ——
  # 台账中 47 项要求 windows-ci 证据，却只有 workflow_dispatch 手动触发的
  # runtime-qualification.yml 能产出。本 job 让 windows-ci 成为常态门禁。
  #
  # 范围（有意收窄，保证快速且低 flake）：只跑纯 Node 的 parity 契约链，
  # 与上面的 parity-guard 同源 —— 不需要 pnpm install、不构建 Rust。
  # 它验证的是「契约在 Windows 的路径分隔符 / 换行 / Node 行为下同样成立」。
  # 仍属缺口、未纳入本 job：Windows 打包矩阵、安装/卸载、SendKeys 输入交互
  # （由 runtime-qualification.yml 的 windows-runtime 承担）。
  windows-parity-guard:
    name: Typora parity guardrails (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 无 Typora 的 runner 上，生成器会保留仓库已入库的 EXTRACTED 基线而不重写
      # （见 generate-typora-menu-dump.mjs），故不会退化成 UNVERIFIED。
      - name: Generate Typora baseline dump
        run: node tests/benchmark/generate-typora-menu-dump.mjs
      - name: Parity guard chain
        run: npm run parity

  rust-check:
    name: Rust system core check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: "Cargo check + test (37 + file-safety 16 + updater 4)"
        working-directory: apps/desktop/src-tauri
        run: cargo test