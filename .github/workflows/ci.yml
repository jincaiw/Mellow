name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一个 ref 的多次运行必须**串行**，且后来的**取消**先前的（2026-10-07，审计 §4.125）。
# 【为什么与 `release.yml` 相反】那边 `cancel-in-progress: false`（release 是**对外**的，
#   取消会留下半成品）；这里 `true` —— **被取代的提交的 CI 结论没有任何价值**，
#   留着它只会白烧 runner 分钟数、并制造「同一个 SHA 两个 run、其中一个是旧的」这种混淆。
# 【实测触发】一次 push 曾产生 **两个** CI run（同一 SHA、同为 `push` 事件、GitHub 侧重复投递）；
#   有了本组，重复/被取代的运行会互相取消，而不是各跑一遍。
# ⚠️ PR 的 `github.ref` 是 `refs/pull/N/merge`，与 `refs/heads/main` **不同组** ⇒ 互不干扰。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 统一 pnpm workspace 工具链（根 package.json + pnpm-workspace.yaml，阶段 0 迁移）。
# 特例：packages/editor-core/CoreEditor（vendored MarkEdit）排除出 workspace，保留上游 yarn。

# **显式声明 token 权限**（2026-10-10，审计 §4.277）：不写这一行时，本 workflow 的有效权限
# 由**仓库设置** `default_workflow_permissions` 决定 —— 那**不在仓库里**、无法审计。
# 【实测（`gh api repos/<owner>/<repo>/actions/permissions/workflow`）】当前该设置为 **`read`**
#   ⇒ 今天**没有**安全缺口；但**换一个仓库 / 有人改了那个设置**，本 workflow 就会**静默**获得写权限。
# ⇒ 与另两个 workflow 对齐（`release.yml` = `contents: write`、`runtime-qualification.yml` = `contents: read`），
#   让**有效权限变成仓库内可审的东西**。CI 只需要读代码。
permissions:
  contents: read

jobs:
  editor-core:
    name: editor-core vendored (yarn) + wrapper (pnpm)
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Vendored CoreEditor (yarn, workspace 特例)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
          yarn test
      # 步骤名**不内嵌用例数**（2026-09-30）：那些数字没有任何东西校验，会随测试增长静默失真。
      # 实证（比枚举更有说服力）：就在写这段注释的同一天，给 export 补了一个 CJK 机制断言测试，
      # 该包用例数即从 83 变成 84 —— 漂移不需要等到「以后」，它当天就会发生。
      # 此前步骤名里内嵌的那批数字已经漂移过一轮（host-api / app-core / commands / export / engine 各包均不同）。
      # 真实数字由 jest 输出（本身即派生），无需在这里复述。护栏 verify-release-gate 禁止回退。
      - name: "Mellow wrapper test + build (contract + neutral)"
        working-directory: packages/editor-core
        run: |
          pnpm test
          pnpm run build
      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: editor-core-dist
          path: packages/editor-core/CoreEditor/dist

  mellow-packages:
    name: Mellow packages typecheck + unit tests
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm -r --filter '!mellow-desktop' run build
      # V7-W5：括号内数字为各包用例数（2026-09-12 实跑），仅作可读性参考；数量变化不会使 Job 失败。
      - name: "Unit tests (all workspace packages)"
        run: pnpm -r --filter '!mellow-desktop' run test

  editor-engine:
    name: editor-engine test + build
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "Test (engine + IME Composition Guard / undo corruption)"
        working-directory: packages/editor-engine
        run: pnpm test
      - name: Build
        working-directory: packages/editor-engine
        run: pnpm run build

  desktop-frontend:
    name: Desktop frontend build
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 30
    needs: [editor-core, editor-engine]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore editor-core dist (vendored bundle)
        uses: actions/download-artifact@v7
        with:
          name: editor-core-dist
          path: packages/editor-core/CoreEditor/dist
      - name: Build editor-core wrapper (dist/bundle.js)
        working-directory: packages/editor-core
        run: pnpm run build
      - name: Build editor-engine (dist/)
        working-directory: packages/editor-engine
        run: pnpm run build
      - name: Desktop build (editor bundle + tsc + vite)
        working-directory: apps/desktop
        run: pnpm run build
      # V7-W5（G7-TYPO-04）：渲染层指纹锁此前从未在 CI 执行 —— 本地 bundle 与 CI 产物
      # 分叉无人发现（版本化文件名 + 时间戳 query，指纹漂移会静默加载旧引擎）。
      # 构建后必须跑 verify-release-bundle.mjs 断言 public/editor 产物与清单一致。
      - name: Verify editor release bundle fingerprint
        working-directory: apps/desktop
        run: node scripts/verify-release-bundle.mjs

  parity-guard:
    name: Typora parity guardrails (ledger + menu schema + guard self-test)
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # v5 起：`package.json` 有 `packageManager` 时**自动开缓存**（release notes 标 Breaking
          # Change）。v5 源码 `src/main.ts` 是 `if (cache) … else if (packageManager && pmCache)`
          # ⇒ 显式 `cache:` 优先，**只有本步没有 `cache:` 时**才走自动分支（本仓另有 10 处已显式
          # `cache: pnpm`，故那 10 处不需要本键 —— 加了也是**不可达配置**）。
          # 此处显式关掉以保持 v4 行为（是否改用自动缓存 = 性能决策，未裁决）。
          package-manager-cache: false
      # 护栏脚本只依赖 Node 内建模块，无需 pnpm install，可在 30s 内给出结论。
      # 无 Typora 授权环境时 dump 生成器退化为 UNVERIFIED 占位（不构成验收证据）。
      - name: Generate Typora baseline dump
        run: node tests/benchmark/generate-typora-menu-dump.mjs
      - name: Parity ledger + menu contract + guard self-test + runtime qualification + UX gate
        run: npm run parity

  # V7-W5（2026-09-12）：补 Windows 契约门禁。
  # 背景：本 workflow 此前 6 个 job 全部 runs-on ubuntu-latest，**没有任何 Windows job**，
  # 与 ADR-0022「Windows 以 GitHub Actions 为正式 Runtime 证据来源」存在落差 ——
  # 台账中 47 项要求 windows-ci 证据，却只有 workflow_dispatch 手动触发的
  # runtime-qualification.yml 能产出。本 job 让 windows-ci 成为常态门禁。
  #
  # 范围（有意收窄，保证快速且低 flake）：只跑纯 Node 的 parity 契约链，
  # 与上面的 parity-guard 同源 —— 不需要 pnpm install、不构建 Rust。
  # 它验证的是「契约在 Windows 的路径分隔符 / 换行 / Node 行为下同样成立」。
  # 仍属缺口、未纳入本 job：Windows 打包矩阵、安装/卸载、SendKeys 输入交互
  # （由 runtime-qualification.yml 的 windows-runtime 承担）。
  windows-parity-guard:
    name: Typora parity guardrails (Windows)
    runs-on: windows-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # v5 起：`package.json` 有 `packageManager` 时**自动开缓存**（release notes 标 Breaking
          # Change）。v5 源码 `src/main.ts` 是 `if (cache) … else if (packageManager && pmCache)`
          # ⇒ 显式 `cache:` 优先，**只有本步没有 `cache:` 时**才走自动分支（本仓另有 10 处已显式
          # `cache: pnpm`，故那 10 处不需要本键 —— 加了也是**不可达配置**）。
          # 此处显式关掉以保持 v4 行为（是否改用自动缓存 = 性能决策，未裁决）。
          package-manager-cache: false
      # 无 Typora 的 runner 上，生成器会保留仓库已入库的 EXTRACTED 基线而不重写
      # （见 generate-typora-menu-dump.mjs），故不会退化成 UNVERIFIED。
      - name: Generate Typora baseline dump
        run: node tests/benchmark/generate-typora-menu-dump.mjs
      - name: Parity guard chain
        run: npm run parity

  rust-check:
    name: Rust system core check + test
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: "Cargo check + test (system core + file-safety + updater)"
        working-directory: apps/desktop/src-tauri
        run: cargo test

  # 立此 job 的原因（2026-10-01）：上面 rust-check 跑在 **ubuntu** —— 于是
  # `#[cfg(target_os = "macos")]` 的平台增强单测**在 CI 里根本不执行**；
  # runtime-qualification 也只跑定向的 `file_safety_corpus` 用例。
  # 结果：「真实系统词典（NSSpellChecker）是否真的给出建议」这类不变量
  # **没有任何机器在守** —— 实测代价：`spellcheck.rs` 那条
  # `suggest_returns_guesses_for_misspelling` 长期是 `let _ = suggest("recieve");`
  # 的**恒真空壳**（测试名声称 returns guesses，断言本体什么都没检查），无人发现。
  # 本仓判据：**不变量只存在于「本地才会跑」的测试里 = 没守护**（同「e2e 不进 CI」母题）。
  # 成本：仓库为 public → macOS runner 免费，代价仅为排队时间。
  rust-check-macos:
    name: Rust macOS-native test (NSSpellChecker + 平台增强)
    runs-on: macos-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Cargo test（含 target_os = macos 的平台增强单测）
        working-directory: apps/desktop/src-tauri
        run: cargo test