name: CI

on:
  push:
    branches: [main]
  pull_request:

# 统一 pnpm workspace 工具链（根 package.json + pnpm-workspace.yaml，2026-08-18 阶段 0 迁移）。
# 特例：packages/editor-core/CoreEditor（vendored MarkEdit）排除出 workspace，保留上游 yarn。

jobs:
  editor-core:
    name: editor-core vendored (yarn) + wrapper (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Vendored CoreEditor (yarn, workspace 特例)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
          yarn test
      - name: "Mellow wrapper test + build (14: contract + neutral)"
        working-directory: packages/editor-core
        run: |
          pnpm test
          pnpm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: editor-core-dist
          path: packages/editor-core/CoreEditor/dist

  mellow-packages:
    name: Mellow packages typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm -r run build
      - name: "Unit tests (host-api 38 / document-model 26 / app-core 119 / i18n 15 / settings 8 / themes 8 / commands 6 / export 46)"
        run: pnpm -r run test

  editor-engine:
    name: editor-engine test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "Test (486: engine + IME Composition Guard / undo corruption)"
        working-directory: packages/editor-engine
        run: pnpm test
      - name: Build
        working-directory: packages/editor-engine
        run: pnpm run build

  desktop-frontend:
    name: Desktop frontend build
    runs-on: ubuntu-latest
    needs: [editor-core, editor-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Restore editor-core dist (vendored bundle)
        uses: actions/download-artifact@v4
        with:
          name: editor-core-dist
          path: packages/editor-core/CoreEditor/dist
      - name: Build editor-core wrapper (dist/bundle.js)
        working-directory: packages/editor-core
        run: pnpm run build
      - name: Build editor-engine (dist/)
        working-directory: packages/editor-engine
        run: pnpm run build
      - name: Desktop build (editor bundle + tsc + vite)
        working-directory: apps/desktop
        run: pnpm run build

  rust-check:
    name: Rust system core check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps