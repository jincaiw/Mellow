name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editor-core:
    name: editor-core test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/editor-core/CoreEditor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: packages/editor-core/CoreEditor/yarn.lock
      - name: Enable yarn (corepack)
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Test (185, vendored CoreEditor)
        run: yarn test
      - name: Build (vendored)
        run: yarn build
      - name: Mellow wrapper test (14: contract + neutral)
        working-directory: packages/editor-core
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm test
          npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: editor-core-dist
          path: packages/editor-core/CoreEditor/dist

  mellow-packages:
    name: Mellow packages typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck all packages
        run: |
          for pkg in host-api editor-react app-core document-model workspace commands i18n themes extension-api shared; do
            echo "== @mellow/$pkg =="
            cd packages/$pkg
            npm install --no-audit --no-fund --ignore-scripts
            npm run build
            cd ../..
          done
      - name: host-api + document-model contract tests
        working-directory: packages/host-api
        run: npm test
      - name: document-model unit tests
        working-directory: packages/document-model
        run: npm test
      - name: app-core unit tests
        working-directory: packages/app-core
        run: npm test

  editor-engine:
    name: editor-engine test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/editor-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/editor-engine/package-lock.json
      - name: Install
        run: npm ci
      - name: Test (430: engine + IME Composition Guard / undo corruption)
        run: npm test
      - name: Build
        run: npm run build

  desktop-frontend:
    name: Desktop frontend build
    runs-on: ubuntu-latest
    needs: [editor-core, editor-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore editor-core dist
        uses: actions/download-artifact@v4
        with:
          name: editor-core-dist
          path: packages/editor-core/CoreEditor/dist
      - name: editor-core deps (bundle build)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
      - name: editor-engine deps + build
        working-directory: packages/editor-engine
        run: |
          npm ci
          npm run build
      - name: Desktop install + build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

  rust-check:
    name: Rust system core check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check
