# Mellow 三平台正式 Packaging（PRD §125/§126/§127）
#
# - Windows：MSI + NSIS EXE
# - macOS：Signed + Notarized + DMG（需 Apple Developer 凭据 secrets）
# - Linux：AppImage + deb + rpm
#
# 触发：手动（workflow_dispatch）或推送 v* 标签（标签推送会创建 Draft Release）。
# 收尾：三平台构建成功后由 finalize 作业写入 Release Notes（.github/release-template.md +
#       git log 生成的提交清单）、**断言三平台制品齐全**，然后自动
#       `draft=false` + `prerelease=false` + `make_latest=true` **正式发布**
#       （**ADR-0031**，2026-10-05 用户裁决；**取代 ADR-0024 Q2=B1 的「保持 pre-release」**）。
#       ⚠️ 2026-10-05 起**不再以「真机 Gate 回填」为发布前置**：发布由「CI 全绿 + 制品断言通过」决定
#       （ADR-0022 的证据政策不变；ADR-0024 **Q1=A3 的闭环口径也不变** —— 正式发布 ≠ 未闭环项已闭环）。
#       ⚠️ **macOS 产物未签名、未公证**（本仓无 Apple 凭据）⇒ 用户首次打开会遇 Gatekeeper 警告；
#       job 名与文案**不得**暗示已签名（ADR-0029 Q3 的护栏继续生效）。
#       ⚠️ 2026-10-01 前这里是**人工**的（注释写着「此后仅需人工执行
#       `gh release edit vX --draft=false`」）—— 已被实测证伪：**12 个 tag 里 6 个
#       （v1.5.6/7/8/11/12/13）从未解除 Draft**，其中一个（v1.5.12）还只有 **12/15 个制品**
#       ⇒ 人工门禁没有机器记录时，**两个方向都会漏**（漏发布、漏不完整构建）。
#       故改为：**先把「人眼扫资产表」变成断言**（关键制品 + 数量下限），断言通过才解除 Draft。
#       注：generate_release_notes 对 Draft Release 不生效，且 PATCH draft 不带 tag_name
#       会把 tag 关联重置为 untagged-…（v1.4.2 首发实证），故 finalize 自行生成清单。
# 工具链：pnpm workspace（根 package.json + pnpm-workspace.yaml，阶段 0 迁移）；
#         特例 packages/editor-core/CoreEditor（vendored MarkEdit）保留上游 yarn。
#
# 所需 secrets：
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD —— updater 签名
#   macOS（Signing + Notarization）：APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
#     APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   Windows 代码签名（可选，未设置则跳过）：WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD

name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同一个 tag 的多次运行必须**串行**（2026-10-06，审计 §4.110）。
# 【为什么需要】v1.5.32 的竞态本质是「**并发操作同一个 release**」—— 那次是三个 job 之间的并发；
# 而**两次运行之间**的并发是同一形态：重跑/重推标签时，两次运行会同时上传到同一个 release
# （症状同样是「制品分落 / 断言失败」，且更难复现）。
# `cancel-in-progress: false` ⇒ 后来的运行**排队**而不是取消前者
# —— **不能取消**：取消会留下半成品 release，而 release 是**对外**的。
# group 按 `github.ref` ⇒ 不同 tag 之间互不影响。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 单一 owner 创建 draft release（2026-10-06，审计 §4.108）──────────────────
  # 【为什么需要】三个平台 job **并发**跑 `tauri-action`，而它的行为是「**找不到 draft 就创建**」。
  # 实测（v1.5.32）：三个 job 同时启动 ⇒ **创建了两个同 tag 的 release** ——
  # macOS 的 `.dmg` 进了其中一个、Windows/Linux 的制品进了另一个
  # ⇒ `finalize` 只看其中一个（**缺 `.dmg`**）⇒ 断言失败 ⇒ **保持 Draft、不发布**。
  # （**门禁工作正常**：它正是为此存在的 —— 只是这次「不完整」的成因是流水线竞态。）
  # 【修法】先由一个 job 把 release 建好，并**断言没有重复**；三平台 job 依赖它 ⇒
  # 它们只会「找到」而不会「创建」⇒ 竞态从根上消失（`tauri-action` 的 find-or-create 逻辑保持原样）。
  create-release:
    name: Create draft release (single owner; prevents concurrent find-or-create race)
    # ⚠️ **不得**在这里加 `if: startsWith(github.ref, 'refs/tags/')` ——
    # 本 workflow 也支持 `workflow_dispatch`，那样会让本 job **被跳过**，
    # 而三个平台 job `needs: [create-release]` ⇒ **连带全被跳过**（把「仅构建」路径也弄没了）。
    # 故：本 job 总是运行，**在步骤内**按 `GITHUB_REF_TYPE` 判断是否真的要创建 release。
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 15
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      # ⚠️ **必须 checkout**（2026-10-06 实测）：`gh release create` 需要一个 **git 仓库上下文**，
      # 否则报 `failed to run git: fatal: not a git repository` 并 exit 1。
      # （本 job 是 §4.108 修竞态时新增的 —— 它**第一次运行**（v1.5.33）就因此失败：
      #   三平台 job `needs:` 它 ⇒ 连带被跳过 ⇒ **整个发布没跑**。修法 = 补这一步。）
      - uses: actions/checkout@v4
      - name: Create draft release if absent (tags only; asserts no duplicate)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "非 tag 触发（GITHUB_REF_TYPE=${GITHUB_REF_TYPE:-未设置}）⇒ 跳过 release 创建，release_id 留空"
            echo "release_id=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")] | length")
          echo "现有同 tag release 数：${COUNT}"
          if [ "${COUNT}" -gt 1 ]; then
            echo "::error::${GITHUB_REF_NAME} 存在 ${COUNT} 个 release —— 并发 find-or-create 竞态的残留。必须先清理（保留资产最全的那个），否则后续上传会落到不同 release 上"
            exit 1
          fi
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")][0].id // empty")
          if [ -z "${ID}" ]; then
            # `--verify-tag`：**tag 不存在就中止**（不得自动从默认分支建 tag —— 那会造出一个
            #   与本次构建无关的 tag）。`--generate-notes`：避免在无 TTY 的 CI 里因缺 notes 而卡住；
            #   正文随后由 `finalize` 步骤覆盖（它才是 notes 的真值源）。
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "Mellow ${GITHUB_REF_NAME}" --generate-notes
            ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")][0].id")
          fi
          echo "release_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "draft release id = ${ID}"

  windows:
    name: Windows (MSI + NSIS)
    needs: [create-release]
    runs-on: windows-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Prepare editor-core (upstream dist, yarn 特例)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build editor-core wrapper + editor-engine
        run: |
          pnpm --filter @mellow/editor-core run build
          pnpm --filter @mellow/editor-engine run build
      - name: Verify release bundle (V6-P0)
        run: |
          node apps/desktop/scripts/build-editor-bundle.mjs
          node apps/desktop/scripts/verify-release-bundle.mjs
      - name: Import Windows code signing certificate (optional)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/cert.pfx", $bytes)
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP/cert.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) | Out-Null
      - name: Build MSI + NSIS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Mellow ${{ github.ref_name }}'
          releaseDraft: true
          args: --bundles msi,nsis
      - name: Build portable zip（master-plan R1：exe + Data 占位 → 便携模式）
        shell: pwsh
        run: |
          $ver = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $out = "apps/desktop/src-tauri/target/release/bundle/portable"
          New-Item -ItemType Directory -Force -Path "$out/Mellow/Data" | Out-Null
          Copy-Item "apps/desktop/src-tauri/target/release/mellow-desktop.exe" "$out/Mellow/Mellow.exe"
          New-Item -ItemType File -Force -Path "$out/Mellow/Data/.keep" | Out-Null
          @'
          Mellow 便携版 (Windows Portable)
          =================================

          使用方法：
            1. 解压到任意有写权限的目录（如 U 盘、桌面）
            2. 双击 Mellow.exe 直接使用，无需安装、无注册表写入

          数据存储：
            - 全部数据（设置、最近文件、版本快照）保存在本文件夹的 Data\ 目录
            - 删除整个 Mellow 文件夹 = 完全卸载，无任何残留

          系统要求：
            - Windows 10 1809+ 且已安装 WebView2 Runtime
            - 多数 Windows 11 / 更新后的 Windows 10 已内置；缺失时从以下地址安装：
              https://developer.microsoft.com/microsoft-edge/webview2/

          升级方式：
            - 便携版不支持应用内更新；请下载新版压缩包解压覆盖（Data\ 目录保留）

          Mellow Portable (Windows Portable)
          ==================================

          Usage:
            1. Extract to any writable location (USB stick, Desktop, etc.)
            2. Run Mellow.exe directly - no installation, no registry writes

          Data:
            - All data (settings, recent files, snapshots) stays in the Data\ folder
            - Delete the whole Mellow folder for a complete uninstall

          Requirements:
            - Windows 10 1809+ with WebView2 Runtime (preinstalled on most
              updated systems; otherwise install from
              https://developer.microsoft.com/microsoft-edge/webview2/)

          Upgrades:
            - In-app updates are disabled in portable mode; download the new
              zip and extract over this copy (keep the Data\ folder)
          '@ | Set-Content -Encoding UTF8 "$out/Mellow/README-Portable.txt"
          Compress-Archive -Path "$out/Mellow" -DestinationPath "$out/Mellow_${ver}_portable_win64.zip" -Force
          Get-ChildItem "$out"
      - name: Attach portable zip to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/portable/*.zip" | Select-Object -First 1
          gh release upload $env:GITHUB_REF_NAME $zip.FullName --clobber
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mellow-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/latest.json
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
          if-no-files-found: error

  macos:
    # ⚠️ 名称**不得宣称无法保证的属性**（2026-09-30）：Apple 凭据缺失时，下面
    # 「Configure Apple signing env」步骤只 echo 一句「产出未签名 DMG」然后**继续**
    # → job 仍会 success。原名称写「Signed + Notarized」在该情形下是**假的**，
    # 而 ADR-0020 §2 要求 V1.0 必须「macOS 签名公证」。
    # 故此处改为如实描述；若要恢复「Signed + Notarized」的名称，
    # 必须同时把凭据缺失改为**硬失败**（护栏 verify-parity-ledger 会检查这一点）。
    name: macOS (DMG；有 Apple 凭据时签名 + 公证)
    needs: [create-release]
    runs-on: macos-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Prepare editor-core (upstream dist, yarn 特例)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build editor-core wrapper + editor-engine
        run: |
          pnpm --filter @mellow/editor-core run build
          pnpm --filter @mellow/editor-engine run build
      - name: Verify release bundle (V6-P0)
        run: |
          node apps/desktop/scripts/build-editor-bundle.mjs
          node apps/desktop/scripts/verify-release-bundle.mjs
      - name: Configure Apple signing env (when secrets provided)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          else
            echo "Apple 凭据未配置：产出未签名 DMG"
          fi
      - name: Build Signed + Notarized DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Mellow ${{ github.ref_name }}'
          releaseDraft: true
          args: --bundles app,dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mellow-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/dmg/*.sig
            apps/desktop/src-tauri/target/release/bundle/dmg/latest.json
          if-no-files-found: error

  linux:
    name: Linux (AppImage + deb + rpm)
    needs: [create-release]
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Install workspace deps
        run: pnpm install --frozen-lockfile
      - name: Prepare editor-core (upstream dist, yarn 特例)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build editor-core wrapper + editor-engine
        run: |
          pnpm --filter @mellow/editor-core run build
          pnpm --filter @mellow/editor-engine run build
      - name: Verify release bundle (V6-P0)
        run: |
          node apps/desktop/scripts/build-editor-bundle.mjs
          node apps/desktop/scripts/verify-release-bundle.mjs
      - name: Build AppImage + deb + rpm
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Mellow ${{ github.ref_name }}'
          releaseDraft: true
          args: --bundles appimage,deb,rpm
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mellow-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/latest.json
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  finalize:
    name: Finalize Draft Release (notes + asset assertions + publish)
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 超时边界：**实测**该 job 的耗时可定（2026-10-10，审计 §4.276）——
    # GitHub 默认 360 min ⇒ 「跑不动」要 6 小时才被发现；此处按实测耗时的数倍留余量。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fill notes, assert assets, publish as official release (ADR-0031)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 注意：--json id 是 GraphQL 节点 ID（RE_...），REST PATCH 必须用数字 databaseId。
          RELEASE_ID=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)
          git fetch --tags --force origin
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^")
          {
            sed "s/__TAG__/${GITHUB_REF_NAME}/g" .github/release-template.md
            git log --oneline "${PREV_TAG}..${GITHUB_REF_NAME}" | sed 's/^/  - /'
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          } > /tmp/release-body.md

          # ① 先只填 body + 标发布状态，**不动 draft 字段**：
          #    - 新 tag 推送时该 release 本来就是 draft（tauri-action 建的）⇒ 失败安全：
          #      即使下面②的断言失败，发布也停在「未公开」状态；
          #    - ⚠️ **不要在这里写 `-F draft=true`** —— 那样「重跑 finalize」会把**已发布**的
          #      release **降级回 Draft**（一次失败的重跑就能把线上发布撤下来）。
          #    PATCH draft 必须显式带 tag_name，否则 tag 关联会被重置为 untagged-…。
          #    ADR-0031：prerelease=false（正式发布）。
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -X PATCH \
            -f tag_name="$GITHUB_REF_NAME" \
            -f body="$(cat /tmp/release-body.md)" \
            -F prerelease=false

          # ② 资产断言 = 把「人眼扫一遍资产表」机器化。解除 Draft 的前置条件。
          #    为什么需要：**人工门禁没有机器记录** —— 实测 12 个 tag 里有 6 个跑完 finalize 后
          #    从未解除 Draft，其中一个（v1.5.12）只有 **12/15 个制品**（三平台有一个没传全）。
          #    即：既漏了发布、又漏了一个不完整构建 —— 两个方向都要机器兜住。
          ASSETS=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          COUNT=$(printf '%s\n' "$ASSETS" | grep -c . || true)
          MISSING=""
          for pat in '\.dmg$' '\.msi$' 'x64-setup\.exe$' '\.AppImage$' '\.deb$' '\.rpm$' 'latest\.json$'; do
            printf '%s\n' "$ASSETS" | grep -Eq "$pat" || MISSING="$MISSING $pat"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::${GITHUB_REF_NAME} 缺少关键制品:${MISSING} —— 保持 Draft、不发布"
            exit 1
          fi
          if [ "$COUNT" -lt 15 ]; then
            echo "::error::${GITHUB_REF_NAME} 只有 ${COUNT} 个制品（下限 15）—— 保持 Draft、不发布"
            exit 1
          fi

          # ③ 断言通过才解除 Draft。`prerelease=false` + `make_latest=true` = **正式发布**
          #    （ADR-0031，2026-10-05 用户裁决）；`releases/latest` 随之指向本版本。
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -X PATCH \
            -f tag_name="$GITHUB_REF_NAME" \
            -F prerelease=false \
            -f make_latest=true \
            -F draft=false

          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\(.assets | length)"'
          # 收口断言：本步跑完必须已是「已发布」—— 否则这一步的意义就没了。
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "false"
