# Mellow 三平台正式 Packaging（PRD §125/§126/§127）
#
# - Windows：MSI + NSIS EXE
# - macOS：Signed + Notarized + DMG（需 Apple Developer 凭据 secrets）
# - Linux：AppImage + deb + rpm
#
# 触发：手动（workflow_dispatch）或推送 v* 标签（标签推送会创建 Draft Release）。
# 所需 secrets：
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD —— updater 签名
#     （生成：npx tauri signer generate -w <path>，私钥内容作为 secret）
#   macOS（Signing + Notarization）：
#     APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#     APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   Windows 代码签名（可选，未设置则跳过）：
#     WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD / WINDOWS_CERTIFICATE_THUMBPRINT

name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSI + NSIS)
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Prepare editor-core (upstream dist)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build editor-core wrapper
        working-directory: packages/editor-core
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
      - name: Build editor-engine
        working-directory: packages/editor-engine
        run: |
          npm ci
          npm run build
      - name: Install export deps
        working-directory: packages/export
        run: npm ci
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci
      - name: Import Windows code signing certificate (optional)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/cert.pfx", $bytes)
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP/cert.pfx" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) | Out-Null
      - name: Build MSI + NSIS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Mellow ${{ github.ref_name }}'
          releaseDraft: true
          args: --bundles msi,nsis
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mellow-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/latest.json
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

  macos:
    name: macOS (Signed + Notarized + DMG)
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Prepare editor-core (upstream dist)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build editor-core wrapper
        working-directory: packages/editor-core
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
      - name: Build editor-engine
        working-directory: packages/editor-engine
        run: |
          npm ci
          npm run build
      - name: Install export deps
        working-directory: packages/export
        run: npm ci
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci
      - name: Build Signed + Notarized DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Mellow ${{ github.ref_name }}'
          releaseDraft: true
          args: --bundles app,dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mellow-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/dmg/*.sig
            apps/desktop/src-tauri/target/release/bundle/dmg/latest.json
          if-no-files-found: error

  linux:
    name: Linux (AppImage + deb + rpm)
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Prepare editor-core (upstream dist)
        working-directory: packages/editor-core/CoreEditor
        run: |
          corepack enable
          yarn install --immutable
          yarn build
      - name: Build editor-core wrapper
        working-directory: packages/editor-core
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
      - name: Build editor-engine
        working-directory: packages/editor-engine
        run: |
          npm ci
          npm run build
      - name: Install export deps
        working-directory: packages/export
        run: npm ci
      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci
      - name: Build AppImage + deb + rpm
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Mellow ${{ github.ref_name }}'
          releaseDraft: true
          args: --bundles appimage,deb,rpm
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mellow-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/release/bundle/appimage/latest.json
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
